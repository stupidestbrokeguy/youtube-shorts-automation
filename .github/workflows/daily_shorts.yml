name: Daily YouTube Shorts

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # This is CRITICAL for pushing
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SET }}  # Use your SET secret
          persist-credentials: true
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install pillow moviepy google-api-python-client google-auth-oauthlib
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Decode secrets
        env:
          CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS_BASE64 }}
          TOKEN: ${{ secrets.TOKEN_PICKLE_BASE64 }}
        run: |
          echo "$CLIENT_SECRETS" | base64 -d > client_secrets.json
          echo "$TOKEN" | base64 -d > token.pickle
      
      - name: Run script
        env:
          GIT_TOKEN: ${{ secrets.SET }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python daily_shorts.py
      
      - name: Push state changes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shorts_state.json
          git diff --staged --quiet || git commit -m "Update shorts_state.json [skip ci]"
          git push
